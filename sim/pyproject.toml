[project]
name = "chalktalk-sim"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "chalktalk-contracts",
    "chalktalk-core",
    "numpy>=2.5.4",
]

[tool.uv.sources]
chalktalk-contracts = { workspace = true }
chalktalk-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chalktalk_sim"]
