[project]
name = "chalktalk-crew"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "chalktalk-contracts",
    "chalktalk-mcp",
    "chalktalk-sim",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.optional-dependencies]
# Live Azure Speech only; CI and tests never install it.
azure = ["azure-cognitiveservices-speech>=1.40"]
# The crew on Foundry Agent Service (CHALKTALK_AGENTS=foundry); manual runs only, never CI.
foundry = [
  "agent-framework-foundry>=1.15",
  "azure-ai-projects>=2.7",
  "azure-identity>=1.26",
  "azure-monitor-opentelemetry>=1.6",
]

[tool.uv.sources]
chalktalk-contracts = { workspace = true }
chalktalk-mcp = { workspace = true }
chalktalk-sim = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chalktalk_crew"]
