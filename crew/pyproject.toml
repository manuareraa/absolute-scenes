[project]
name = "chalktalk-crew"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["chalktalk-contracts"]

[project.optional-dependencies]
# Live Azure Speech only; CI and tests never install it.
azure = ["azure-cognitiveservices-speech>=1.40"]

[tool.uv.sources]
chalktalk-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chalktalk_crew"]
