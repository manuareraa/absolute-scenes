[project]
name = "chalktalk-core"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "chalktalk-contracts",
    "numpy>=2.5.4",
]

[tool.uv.sources]
chalktalk-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chalktalk_core"]
