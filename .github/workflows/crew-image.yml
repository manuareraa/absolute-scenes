# Builds the live crew image (crew/Dockerfile, the "Ask the pundit" service) and pushes it to GHCR.
# PRs build only; main and manual runs push ghcr.io/manuareraa/chalktalk-ask:{latest,sha-<short>}.
# Uses GITHUB_TOKEN only; nothing here talks to Azure.
name: crew-image

on:
  push:
    branches: [main]
    paths:
      - "crew/**"
      - "mcp/**"
      - "core/**"
      - "sim/**"
      - "contracts/schemas/**"
      - "contracts/python/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/crew-image.yml"
  pull_request:
    paths:
      - "crew/**"
      - "mcp/**"
      - "core/**"
      - "sim/**"
      - "contracts/schemas/**"
      - "contracts/python/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/crew-image.yml"
  workflow_dispatch:

concurrency:
  group: crew-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/manuareraa/chalktalk-ask

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=chalktalk-ask
            org.opencontainers.image.description=Absolute Scenes live crew, Ask the pundit (synthetic data only)
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crew/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (health endpoint)
        if: github.event_name == 'pull_request'
        run: |
          tag=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name ask -p 8080:8080 "$tag"
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8080/healthz && exit 0
            sleep 1
          done
          docker logs ask
          exit 1
