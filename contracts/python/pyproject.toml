[project]
name = "chalktalk-contracts"
version = "0.0.0"
description = "ChalkTalk shared contracts: JSON Schemas, generated Pydantic models, validation."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "jsonschema>=4.23", "referencing>=0.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chalktalk_contracts"]

[tool.hatch.build.targets.wheel.force-include]
"../schemas" = "chalktalk_contracts/schemas"
